<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MYP Companion — Learn · Understand · Succeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --bg-primary: #030712;
  --bg-secondary: #0f1629;
  --bg-card: rgba(255,255,255,0.03);
  --bg-card-hover: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(212,175,55,0.3);
  --text-primary: #f1f5f9;
  --text-secondary: rgba(255,255,255,0.6);
  --text-muted: rgba(255,255,255,0.4);
  --accent: #D4AF37;
  --accent-2: #F0D060;
  --accent-glow: rgba(212,175,55,0.15);
  --accent-glow-strong: rgba(212,175,55,0.25);
  --crit-a: #60a5fa;
  --crit-b: #34d399;
  --crit-c: #f472b6;
  --crit-d: #a78bfa;
  --sidebar-w: 260px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  overflow-x:hidden;
}

/* ── Mono / code ── */
code, pre, .mono, .stat-val, .crit-perf-score {
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(212,175,55,0.2);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(212,175,55,0.4);}

/* ── Keyframes ── */
@keyframes fadeSlideUp{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{
  from{opacity:0;}to{opacity:1;}
}
@keyframes floatOrb{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(40px,-30px) scale(1.05);}
  66%{transform:translate(-20px,20px) scale(0.97);}
}
@keyframes meshDrift{
  0%{background-position:0 0;}
  100%{background-position:60px 60px;}
}
@keyframes spinRing{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
@keyframes gradientShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
@keyframes pulse{
  0%,100%{opacity:1;}
  50%{opacity:0.5;}
}
@keyframes shimmer{
  0%{background-position:-200% 0;}
  100%{background-position:200% 0;}
}
@keyframes spinSlow{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
@keyframes counterSpin{
  from{transform:rotate(0deg);}
  to{transform:rotate(-360deg);}
}

/* ── Utility ── */
.fade-slide-up{animation:fadeSlideUp 0.5s ease forwards;}
.fade-in{animation:fadeIn 0.4s ease forwards;}

/* ── Glass card ── */
.glass-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:16px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:border-color 0.2s ease,transform 0.2s ease,box-shadow 0.2s ease;
}
.glass-card:hover{
  border-color:var(--border-hover);
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(212,175,55,0.08);
}

/* ── Buttons ── */
.btn-gold{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#D4AF37,#F0D060,#D4AF37);
  background-size:200% auto;
  color:#030712;
  font-family:'DM Sans',sans-serif;
  font-weight:600;font-size:14px;
  padding:10px 24px;border-radius:10px;border:none;
  cursor:pointer;
  transition:background-position 0.4s ease,box-shadow 0.2s ease,transform 0.15s ease;
}
.btn-gold:hover{
  background-position:right center;
  box-shadow:0 4px 20px rgba(212,175,55,0.45);
  transform:translateY(-1px);
}
.btn-gold:active{transform:translateY(0);}
.btn-ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  color:var(--text-primary);
  font-family:'DM Sans',sans-serif;
  font-weight:500;font-size:14px;
  padding:10px 24px;border-radius:10px;
  cursor:pointer;backdrop-filter:blur(8px);
  transition:background 0.2s ease,border-color 0.2s ease,transform 0.15s ease;
}
.btn-ghost:hover{
  background:rgba(255,255,255,0.1);
  border-color:rgba(255,255,255,0.2);
  transform:translateY(-1px);
}

/* ── Landing page ── */
#landing-root{
  position:fixed;inset:0;
  background:var(--bg-primary);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  z-index:1000;
}
.orb{
  position:absolute;border-radius:50%;
  filter:blur(80px);
  pointer-events:none;
}
.orb-1{width:600px;height:600px;background:rgba(212,175,55,0.07);top:-200px;left:-200px;animation:floatOrb 12s ease-in-out infinite;}
.orb-2{width:500px;height:500px;background:rgba(15,22,41,0.9);top:50%;right:-150px;animation:floatOrb 16s ease-in-out infinite reverse;}
.orb-3{width:400px;height:400px;background:rgba(212,175,55,0.04);bottom:-100px;left:30%;animation:floatOrb 10s ease-in-out infinite 2s;}

.mesh-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);
  background-size:60px 60px;
  animation:meshDrift 20s linear infinite;
  pointer-events:none;
}

.landing-hero{
  position:relative;z-index:2;
  text-align:center;
  max-width:780px;padding:0 24px;
}
.landing-tagline{
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:500;
  letter-spacing:0.15em;text-transform:uppercase;
  color:var(--accent);
  margin-bottom:24px;
  opacity:0;animation:fadeSlideUp 0.6s 0.2s ease forwards;
}
.landing-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(52px,7vw,96px);
  font-weight:800;
  line-height:1.05;
  margin-bottom:28px;
  opacity:0;animation:fadeSlideUp 0.6s 0.35s ease forwards;
}
.landing-title .grad-word{
  background:linear-gradient(135deg,#D4AF37 0%,#F0D060 40%,#D4AF37 80%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:gradientShift 4s ease infinite;
}
.landing-slash{color:rgba(255,255,255,0.15);font-weight:300;}
.landing-sub{
  font-size:17px;font-weight:400;
  color:var(--text-secondary);
  max-width:480px;margin:0 auto 40px;
  line-height:1.7;
  opacity:0;animation:fadeSlideUp 0.6s 0.5s ease forwards;
}
.landing-cta-wrap{
  opacity:0;animation:fadeSlideUp 0.6s 0.65s ease forwards;
}
.btn-gold-lg{
  padding:16px 44px;font-size:16px;border-radius:12px;
  letter-spacing:0.02em;
}

/* spinning ring bottom-right */
.spin-ring{
  position:absolute;bottom:40px;right:60px;
  width:120px;height:120px;
  pointer-events:none;
  opacity:0;animation:fadeIn 1s 1.2s ease forwards;
}
.spin-ring-outer{
  width:120px;height:120px;
  border:1.5px solid rgba(212,175,55,0.3);
  border-radius:50%;
  animation:spinSlow 12s linear infinite;
  position:absolute;
}
.spin-ring-inner{
  width:84px;height:84px;
  border:1.5px dashed rgba(212,175,55,0.15);
  border-radius:50%;
  position:absolute;top:18px;left:18px;
  animation:counterSpin 8s linear infinite;
}
.spin-ring-dot{
  width:6px;height:6px;background:var(--accent);border-radius:50%;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 12px var(--accent);
}

/* ── Onboarding ── */
.onboard-wrap{
  position:fixed;inset:0;
  background:var(--bg-primary);
  display:flex;align-items:center;justify-content:center;
  z-index:900;overflow:hidden;
}
.onboard-card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  backdrop-filter:blur(20px);
  padding:48px 52px;
  width:520px;max-width:calc(100vw - 32px);
  position:relative;z-index:2;
  animation:fadeSlideUp 0.5s ease forwards;
}
.onboard-step-label{
  font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px;
}
.onboard-title{
  font-family:'Playfair Display',serif;
  font-size:28px;font-weight:700;
  margin-bottom:8px;color:var(--text-primary);
}
.onboard-sub{font-size:14px;color:var(--text-secondary);margin-bottom:32px;}

.onboard-input{
  width:100%;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:14px 18px;
  font-family:'DM Sans',sans-serif;
  font-size:16px;color:var(--text-primary);
  outline:none;
  transition:border-color 0.2s ease,box-shadow 0.2s ease;
}
.onboard-input::placeholder{color:var(--text-muted);}
.onboard-input:focus{
  border-color:rgba(212,175,55,0.5);
  box-shadow:0 0 0 3px rgba(212,175,55,0.1);
}

.year-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.year-tile{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:16px 8px;
  text-align:center;cursor:pointer;
  transition:all 0.2s ease;
}
.year-tile:hover{border-color:rgba(212,175,55,0.3);background:rgba(212,175,55,0.06);}
.year-tile.active{
  border-color:var(--accent);
  background:rgba(212,175,55,0.12);
  box-shadow:0 0 20px rgba(212,175,55,0.15);
}
.year-tile-num{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--accent);}
.year-tile-label{font-size:11px;color:var(--text-muted);margin-top:4px;}

.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.track-tile{
  background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(255,255,255,0.08);
  border-radius:14px;padding:24px;
  cursor:pointer;
  transition:all 0.2s ease;
}
.track-tile:hover{border-color:rgba(212,175,55,0.3);background:rgba(212,175,55,0.05);}
.track-tile.active{
  border-color:var(--accent);
  background:rgba(212,175,55,0.1);
  box-shadow:0 0 24px rgba(212,175,55,0.12);
}
.track-icon{font-size:24px;margin-bottom:10px;}
.track-name{font-weight:700;font-size:16px;margin-bottom:4px;}
.track-desc{font-size:12px;color:var(--text-secondary);}

.step-dots{display:flex;gap:8px;justify-content:center;margin-top:32px;}
.step-dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,0.15);
  transition:all 0.3s ease;
}
.step-dot.active{background:var(--accent);width:24px;border-radius:4px;}

/* ── App shell ── */
.app-shell{display:flex;height:100vh;overflow:hidden;}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:linear-gradient(180deg,#0f1629 0%,#030712 100%);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  position:relative;
}
.sidebar::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,0.3),transparent);
}
.sidebar-brand{
  padding:24px 20px 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.brand-mark{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#D4AF37,#F0D060);
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-weight:800;font-size:16px;color:#030712;
  flex-shrink:0;
}
.brand-name{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:var(--text-primary);}
.brand-sub{font-size:10px;color:var(--text-muted);margin-top:1px;}

.sidebar-section{padding:20px 12px 6px;}
.sidebar-section-label{
  font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--text-muted);padding:0 8px;margin-bottom:6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;
  font-size:13px;font-weight:500;color:var(--text-secondary);
  cursor:pointer;position:relative;
  transition:all 0.2s ease;
  border:1px solid transparent;
  margin-bottom:2px;
}
.nav-item:hover{
  background:rgba(255,255,255,0.05);
  color:var(--text-primary);
  border-color:rgba(255,255,255,0.05);
}
.nav-item.active{
  background:rgba(212,175,55,0.08);
  color:var(--accent);
  border-color:rgba(212,175,55,0.12);
}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;border-radius:0 2px 2px 0;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent);
}
.nav-item-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7;}
.nav-item.active .nav-item-icon{opacity:1;}
.nav-glow-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin-left:auto;
  box-shadow:0 0 6px var(--accent);
  animation:pulse 2s ease-in-out infinite;
}

.sidebar-profile{
  margin-top:auto;padding:16px;
  border-top:1px solid rgba(255,255,255,0.06);
}
.profile-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:12px;padding:12px;
  display:flex;align-items:center;gap:10px;
  cursor:pointer;
  transition:background 0.2s ease;
}
.profile-card:hover{background:rgba(255,255,255,0.07);}
.avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#D4AF37,#F0D060);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:#030712;flex-shrink:0;
}
.profile-name{font-size:12px;font-weight:600;color:var(--text-primary);}
.profile-meta{font-size:10px;color:var(--text-muted);}
.signout-btn{
  margin-left:auto;
  background:none;border:none;cursor:pointer;
  color:var(--text-muted);
  transition:color 0.2s ease;
  padding:4px;
}
.signout-btn:hover{color:var(--accent);}

/* ── Main content area ── */
.main-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  background:var(--bg-primary);
  position:relative;
}

/* ── Hero banners ── */
.page-hero{
  background:linear-gradient(135deg,#0f1629 0%,#1a2340 50%,#0f1629 100%);
  padding:48px 40px;
  position:relative;overflow:hidden;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.page-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 70% 50%, rgba(212,175,55,0.06) 0%, transparent 70%);
}
.hero-eyebrow{
  font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.hero-eyebrow::before{content:'';display:inline-block;width:20px;height:1.5px;background:var(--accent);}
.hero-title{
  font-family:'Playfair Display',serif;
  font-size:36px;font-weight:800;
  line-height:1.15;margin-bottom:10px;
  color:var(--text-primary);
  position:relative;z-index:1;
}
.hero-sub{
  font-size:15px;color:var(--text-secondary);
  max-width:480px;line-height:1.65;
  position:relative;z-index:1;
}
.hero-meta-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1;}
.meta-chip{
  font-size:11px;font-weight:500;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;padding:4px 12px;
  color:var(--text-secondary);
}

/* ── Page content wrapper ── */
.page-content{padding:32px 40px;}
.section-title{
  font-family:'Playfair Display',serif;
  font-size:18px;font-weight:700;
  color:var(--text-primary);margin-bottom:16px;
}

/* ── Stat cards ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
.stat-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:16px;backdrop-filter:blur(12px);
  padding:20px;
  transition:all 0.2s ease;
}
.stat-card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 8px 32px rgba(212,175,55,0.08);}
.stat-icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--accent-glow);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}
.stat-val{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--text-primary);line-height:1;}
.stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px;}
.stat-delta{font-size:11px;color:var(--crit-b);margin-top:6px;font-weight:500;}

/* ── Progress bars ── */
.progress-bar-track{
  height:6px;border-radius:3px;
  background:rgba(255,255,255,0.08);
  overflow:hidden;margin-top:8px;
}
.progress-bar-fill{
  height:100%;border-radius:3px;
  transition:width 0.8s ease;
}

/* ── Filter chips ── */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.filter-chip{
  font-size:12px;font-weight:500;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;padding:6px 14px;
  color:var(--text-secondary);cursor:pointer;
  transition:all 0.2s ease;
}
.filter-chip:hover{border-color:rgba(212,175,55,0.3);color:var(--text-primary);}
.filter-chip.active{
  background:rgba(212,175,55,0.12);
  border-color:var(--accent);
  color:var(--accent);
}

/* ── Band / count selector ── */
.band-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
.band-tile{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;padding:14px 8px;text-align:center;
  cursor:pointer;transition:all 0.2s ease;
}
.band-tile:hover{border-color:rgba(212,175,55,0.3);}
.band-tile.active{border-color:var(--accent);background:rgba(212,175,55,0.08);}
.band-label{font-size:13px;font-weight:600;color:var(--text-primary);}
.band-sub{font-size:10px;color:var(--text-muted);margin-top:2px;}

.count-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
.count-tile{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;padding:12px;text-align:center;
  cursor:pointer;transition:all 0.2s ease;
}
.count-tile:hover{border-color:rgba(212,175,55,0.3);}
.count-tile.active{border-color:var(--accent);background:rgba(212,175,55,0.08);}
.count-label{font-size:15px;font-weight:700;color:var(--text-primary);}
.count-sub{font-size:10px;color:var(--text-muted);margin-top:2px;}

/* ── Toggle tiles ── */
.toggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
.toggle-tile{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;padding:16px;cursor:pointer;
  transition:all 0.2s ease;display:flex;align-items:center;gap:12px;
}
.toggle-tile:hover{border-color:rgba(212,175,55,0.3);}
.toggle-tile.active{border-color:var(--accent);background:rgba(212,175,55,0.08);}
.toggle-tile-icon{font-size:20px;}
.toggle-tile-name{font-size:14px;font-weight:600;color:var(--text-primary);}
.toggle-tile-desc{font-size:11px;color:var(--text-secondary);margin-top:2px;}

/* ── Unit cards ── */
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.unit-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:16px;overflow:hidden;
  cursor:pointer;transition:all 0.2s ease;
  position:relative;
}
.unit-card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 8px 32px rgba(212,175,55,0.08);}
.unit-card-top{height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.unit-card-body{padding:20px;}
.unit-emoji{font-size:28px;margin-bottom:12px;}
.unit-title{font-weight:700;font-size:15px;color:var(--text-primary);margin-bottom:4px;}
.unit-sub{font-size:12px;color:var(--text-secondary);margin-bottom:12px;}
.unit-chips{display:flex;gap:6px;flex-wrap:wrap;}
.unit-chip{
  font-size:10px;font-weight:500;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;padding:3px 8px;color:var(--text-muted);
}
.unit-footer{
  padding:12px 20px;
  border-top:1px solid rgba(255,255,255,0.05);
  display:flex;align-items:center;justify-content:space-between;
}
.unit-q-count{font-size:12px;color:var(--text-muted);}

/* ── Alert box ── */
.alert-dark{
  background:rgba(212,175,55,0.06);
  border:1px solid rgba(212,175,55,0.2);
  border-radius:12px;padding:16px 20px;
  display:flex;gap:12px;
  margin-top:24px;
}
.alert-icon{flex-shrink:0;margin-top:1px;}
.alert-text{font-size:13px;color:var(--text-secondary);line-height:1.6;}
.alert-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px;}

/* ── Investigation cards ── */
.inv-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:14px;
  border-left:3px solid var(--accent);
  padding:20px;
  cursor:pointer;
  transition:all 0.2s ease;
}
.inv-card:hover{border-color:var(--border-hover);border-left-color:var(--accent-2);transform:translateY(-2px);}
.inv-title{font-weight:700;font-size:14px;color:var(--text-primary);margin-bottom:6px;}
.inv-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.inv-badge{
  font-size:10px;font-weight:600;
  border-radius:6px;padding:3px 8px;
}

/* ── Criterion cards ── */
.crit-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:16px;padding:28px;
  transition:all 0.2s ease;
}
.crit-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.2);}
.crit-letter{
  font-family:'Playfair Display',serif;
  font-size:48px;font-weight:800;line-height:1;
  margin-bottom:12px;
}
.crit-name{font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:8px;}
.crit-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:20px;}

/* ── Chat ── */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 1px);}
.chat-header{
  padding:20px 32px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  background:rgba(15,22,41,0.8);backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:14px;
  flex-shrink:0;
}
.ai-avatar{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,rgba(212,175,55,0.2),rgba(212,175,55,0.08));
  border:1px solid rgba(212,175,55,0.25);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.chat-messages{flex:1;overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column;gap:16px;}
.msg-wrap{display:flex;gap:12px;max-width:680px;}
.msg-wrap.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-bubble{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;padding:14px 18px;
  font-size:14px;line-height:1.65;color:var(--text-primary);
}
.msg-wrap.user .msg-bubble{
  background:rgba(212,175,55,0.08);
  border-color:rgba(212,175,55,0.15);
}
.msg-avatar{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.msg-avatar.ai{background:rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.2);}
.msg-avatar.user{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);}
.chat-input-area{
  padding:16px 32px 24px;
  border-top:1px solid rgba(255,255,255,0.06);
  flex-shrink:0;
}
.chat-input-row{
  display:flex;gap:10px;align-items:flex-end;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:10px 10px 10px 16px;
  transition:border-color 0.2s ease;
}
.chat-input-row:focus-within{border-color:rgba(212,175,55,0.35);}
.chat-textarea{
  flex:1;background:none;border:none;outline:none;resize:none;
  font-family:'DM Sans',sans-serif;font-size:14px;
  color:var(--text-primary);line-height:1.5;
  max-height:120px;
}
.chat-textarea::placeholder{color:var(--text-muted);}
.send-btn{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#D4AF37,#F0D060);
  border:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.15s ease,box-shadow 0.2s ease;
}
.send-btn:hover{transform:scale(1.05);box-shadow:0 4px 14px rgba(212,175,55,0.4);}

/* ── Badges ── */
.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.badge-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;padding:20px;text-align:center;
  transition:all 0.2s ease;
}
.badge-card:hover{border-color:var(--border-hover);}
.badge-card.locked{opacity:0.45;}
.badge-icon{font-size:32px;margin-bottom:10px;}
.badge-name{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:4px;}
.badge-desc{font-size:11px;color:var(--text-secondary);}
.badge-card.earned{border-color:rgba(212,175,55,0.2);background:rgba(212,175,55,0.04);}

/* ── Empty state ── */
.empty-state{
  border:1px dashed rgba(255,255,255,0.1);
  border-radius:16px;padding:48px 24px;text-align:center;
  margin-top:16px;
}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.5;}
.empty-title{font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--text-muted);}

/* ── Settings ── */
.settings-section{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:16px;padding:28px;margin-bottom:20px;
}
.settings-label{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
.settings-field-label{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;}

/* ── Dashboard quote ── */
.quote-card{
  background:var(--bg-card);
  border:1px solid rgba(212,175,55,0.2);
  border-left:3px solid var(--accent);
  border-radius:16px;padding:24px 28px;
  margin-top:24px;
}
.quote-text{
  font-family:'Playfair Display',serif;
  font-size:17px;font-style:italic;font-weight:600;
  color:var(--text-primary);line-height:1.6;margin-bottom:10px;
}
.quote-author{font-size:12px;color:var(--text-muted);letter-spacing:0.05em;}

/* ── Dashboard continue learning ── */
.learn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.learn-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;padding:20px;cursor:pointer;
  transition:all 0.2s ease;display:flex;align-items:center;gap:14px;
}
.learn-card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 6px 24px rgba(212,175,55,0.07);}
.learn-icon{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:var(--accent-glow);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.learn-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:3px;}
.learn-meta{font-size:11px;color:var(--text-muted);}

/* ── Criterion performance ── */
.crit-perf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px;}
.crit-perf-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;padding:18px;transition:all 0.2s ease;
}
.crit-perf-card:hover{border-color:var(--border-hover);transform:translateY(-1px);}
.crit-perf-letter{font-family:'Playfair Display',serif;font-size:22px;font-weight:800;}
.crit-perf-name{font-size:11px;color:var(--text-muted);margin-bottom:10px;}
.crit-perf-score{font-size:24px;font-weight:700;color:var(--text-primary);}
.crit-perf-max{font-size:11px;color:var(--text-muted);}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
  z-index:800;display:flex;align-items:center;justify-content:center;
  animation:fadeIn 0.2s ease forwards;
}
.modal-box{
  background:linear-gradient(135deg,#0f1629,#1a2340);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;padding:36px;
  width:480px;max-width:calc(100vw - 32px);
  animation:fadeSlideUp 0.3s ease forwards;
  position:relative;
}
.modal-close{
  position:absolute;top:16px;right:16px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-muted);font-size:16px;
  transition:all 0.2s ease;
}
.modal-close:hover{background:rgba(255,255,255,0.1);color:var(--text-primary);}
.modal-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text-secondary);margin-bottom:24px;}

/* ── SVG ornament ── */
.hero-ornament{
  position:absolute;right:40px;top:50%;transform:translateY(-50%);
  opacity:0.15;pointer-events:none;
}

/* ── Responsive ── */
@media(max-width:900px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .crit-perf-grid{grid-template-columns:repeat(2,1fr);}
  .learn-grid{grid-template-columns:repeat(2,1fr);}
  .badges-grid{grid-template-columns:repeat(2,1fr);}
  .page-content{padding:24px 20px;}
  .page-hero{padding:36px 20px;}
  .hero-title{font-size:26px;}
}
@media(max-width:640px){
  :root{--sidebar-w:0px;}
  .sidebar{display:none;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .year-grid{grid-template-columns:repeat(3,1fr);}
  .track-grid{grid-template-columns:1fr;}
  .learn-grid{grid-template-columns:1fr;}
  .crit-perf-grid{grid-template-columns:1fr 1fr;}
}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useCallback} = React;

/* ─── SVG Icons ─── */
const Icon = ({name, size=16, color='currentColor', style={}}) => {
  const icons = {
    dashboard: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>,
    ai: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6L12 2z"/></svg>,
    book: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>,
    papers: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>,
    flask: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M9 3h6M9 3v7l-4 10h14L15 10V3"/><path d="M8 17h8"/></svg>,
    target: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
    chart: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M18 20V10M12 20V4M6 20v-6"/></svg>,
    settings: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>,
    signout: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>,
    arrow: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M5 12h14M12 5l7 7-7 7"/></svg>,
    arrowRight: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="2" viewBox="0 0 24 24" style={style}><path d="M5 12h14M12 5l7 7-7 7"/></svg>,
    send: <svg width={size} height={size} fill={color} viewBox="0 0 24 24" style={style}><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>,
    star: <svg width={size} height={size} fill={color} viewBox="0 0 24 24" style={style}><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>,
    fire: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M12 22c-4.97 0-9-3.13-9-7 0-2.5 1.5-4.5 3.5-5.5.5 2 2 3.5 2 3.5s-.5-3 2-6c2 1.5 3.5 4 3.5 4s.5-2 2-3.5C18.5 10 21 12.5 21 15c0 3.87-4.03 7-9 7z"/></svg>,
    zap: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>,
    trophy: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M8 21h8M12 17v4M17 4H7v8c0 2.76 2.24 5 5 5s5-2.24 5-5V4z"/><path d="M7 6H4v4c0 1.65 1.35 3 3 3M17 6h3v4c0 1.65-1.35 3-3 3"/></svg>,
    hash: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>,
    lock: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>,
    check: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="2" viewBox="0 0 24 24" style={style}><path d="M20 6L9 17l-5-5"/></svg>,
    info: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>,
    calculator: <svg width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" viewBox="0 0 24 24" style={style}><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2M12 10h2M16 10h.01M8 14h2M12 14h2M16 14h2M8 18h2M12 18h2M16 18h2"/></svg>,
    sparkle: <svg width={size} height={size} viewBox="0 0 24 24" fill={color} style={style}><path d="M12 2l1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5L12 2zM6 18l.75 2.25L9 21l-2.25.75L6 24l-.75-2.25L3 21l2.25-.75L6 18zM18 16l.75 2.25L21 19l-2.25.75L18 22l-.75-2.25L15 19l2.25-.75L18 16z"/></svg>,
  };
  return icons[name] || null;
};

/* ─── Landing Page ─── */
const LandingPage = ({onStart}) => (
  <div id="landing-root">
    <div className="orb orb-1"/>
    <div className="orb orb-2"/>
    <div className="orb orb-3"/>
    <div className="mesh-grid"/>
    <div className="landing-hero">
      <div className="landing-tagline">IB Mathematics · MYP Years 1–5</div>
      <h1 className="landing-title">
        <span className="grad-word">Learn</span>
        <span className="landing-slash"> / </span>
        <span className="grad-word">Understand</span>
        <span className="landing-slash"> / </span>
        <span className="grad-word">Succeed</span>
      </h1>
      <p className="landing-sub">
        Your intelligent companion for IB MYP Mathematics. Practice smarter, track your criterion performance, and master every topic with AI-powered guidance.
      </p>
      <div className="landing-cta-wrap">
        <button className="btn-gold btn-gold-lg" onClick={onStart}>
          Get Started <Icon name="arrowRight" size={16} color="#030712"/>
        </button>
      </div>
    </div>
    <div className="spin-ring">
      <div className="spin-ring-outer"/>
      <div className="spin-ring-inner"/>
      <div className="spin-ring-dot"/>
    </div>
  </div>
);

/* ─── Onboarding ─── */
const Onboarding = ({onComplete}) => {
  const [step, setStep] = useState(0);
  const [name, setName] = useState('');
  const [year, setYear] = useState(null);
  const [track, setTrack] = useState(null);

  const steps = ['Your Name','Your Year','Your Track'];
  const canNext = [name.trim().length>0, year!==null, track!==null];

  const next = () => {
    if(step<2) setStep(s=>s+1);
    else if(canNext[step]) onComplete({name:name.trim(),year,track});
  };

  return (
    <div className="onboard-wrap">
      <div className="orb orb-1" style={{opacity:0.4}}/>
      <div className="mesh-grid" style={{opacity:0.5}}/>
      <div className="onboard-card">
        <div className="onboard-step-label">Step {step+1} of 3 · {steps[step]}</div>
        {step===0 && <>
          <h2 className="onboard-title">What's your name?</h2>
          <p className="onboard-sub">We'll personalise your learning journey.</p>
          <input
            className="onboard-input"
            type="text"
            placeholder="Enter your full name..."
            value={name}
            onChange={e=>setName(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&canNext[0]&&next()}
            autoFocus
          />
        </>}
        {step===1 && <>
          <h2 className="onboard-title">Which MYP Year?</h2>
          <p className="onboard-sub">Select your current year of study.</p>
          <div className="year-grid">
            {[1,2,3,4,5].map(y=>(

    {letter:'B',name:'Investigating Patterns',color:'var(--crit-b)',hexColor:'#34d399',
      desc:'Identify, extend, and verify mathematical patterns. These tasks reward conjecture, generalisation, and proof-like justification.',
      topics:['Sequence recognition','Conjecture formation','General term','Proof by example']},
    {letter:'C',name:'Communicating',color:'var(--crit-c)',hexColor:'#f472b6',
      desc:'Demonstrate clear mathematical communication using correct notation, working, and reasoning in written form.',
      topics:['Formal working','Diagrams & graphs','Mathematical language','Logical structure']},
    {letter:'D',name:'Applying in Context',color:'var(--crit-d)',hexColor:'#a78bfa',

  return (
    <div className="fade-in">
      <div className="page-hero">
        <div className="hero-eyebrow">Practice</div>
        <h1 className="hero-title">Criterion Tests</h1>
        <p className="hero-sub">Targeted tests for each MYP assessment criterion — A, B, C, and D.</p>
      </div>
      <div className="page-content">
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:18}}>
          {crits.map((c,i)=>(
            <div key={i} className="crit-card" style={{borderTop:`3px solid ${c.hexColor}`}}>
              <div className="crit-letter" style={{color:c.color}}>{c.letter}</div>
              <div className="crit-name">{c.name}</div>
              <div className="crit-desc">{c.desc}</div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:20}}>
                {c.topics.map((t,j)=>(
                  <div key={j} style={{fontSize:10,fontWeight:500,background:`${c.hexColor}12`,border:`1px solid ${c.hexColor}25`,borderRadius:20,padding:'3px 8px',color:c.hexColor}}>{t}</div>
                ))}
              </div>
              <button className="btn-gold" style={{width:'100%',padding:'11px',fontSize:13}}>
                Practice Criterion {c.letter} <Icon name="arrowRight" size={13} color="#030712"/>
              </button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ─── AI Teacher ─── */
const AITeacher = ({user}) => {
  const [msgs, setMsgs] = useState([
    {role:'ai',text:`Hello ${user.name.split(' ')[0]}! I'm your personal MYP Mathematics tutor. I can help you understand any concept, walk through worked examples, or break down tricky exam questions. What would you like to explore today?`},
    {role:'user',text:'Can you explain how to solve quadratic equations by completing the square?'},
    {role:'ai',text:`Absolutely! Completing the square is a powerful technique. Here's the step-by-step method:\n\nGiven: ax² + bx + c = 0\n\n1. Divide through by a (if a ≠ 1)\n2. Move the constant to the right: x² + (b/a)x = −c/a\n3. Add (b/2a)² to both sides\n4. Factor the left side as a perfect square: (x + b/2a)² = ...\n5. Square root both sides (don't forget ±)\n6. Solve for x\n\nWould you like me to work through a specific example with numbers?`},
  ]);
  const [input, setInput] = useState('');
  const bottomRef = useRef(null);
  const taRef = useRef(null);

  const send = useCallback(()=>{
    if(!input.trim()) return;
    const userMsg = {role:'user',text:input.trim()};
    setMsgs(m=>[...m,userMsg]);
    setInput('');
    setTimeout(()=>{
      setMsgs(m=>[...m,{role:'ai',text:`That's a great question! Let me work through that for you step by step. Understanding "${userMsg.text.slice(0,40)}..." is key to mastering this area of the syllabus. I'll break it down using examples relevant to MYP Year ${user.year}.`}]);
    },900);
  },[input,user.year]);

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs]);

  const handleKey = e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} };

  return (
    <div className="chat-wrap">
      <div className="chat-header">
        <div className="ai-avatar"><Icon name="sparkle" size={18} color="#D4AF37"/></div>
        <div>
          <div style={{fontWeight:700,fontSize:15}}>AI Teacher</div>
          <div style={{fontSize:12,color:'var(--accent)',display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:6,height:6,borderRadius:'50%',background:'#34d399',boxShadow:'0 0 6px #34d399'}}/>
            Online · Ready to help
          </div>
        </div>
      </div>
      <div className="chat-messages">
        {msgs.map((m,i)=>(
          <div key={i} className={`msg-wrap${m.role==='user'?' user':''}`}>
            <div className={`msg-avatar ${m.role}`}>
              {m.role==='ai' ? <Icon name="sparkle" size={14} color="#D4AF37"/> : user.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
            </div>
            <div className="msg-bubble" style={{whiteSpace:'pre-wrap'}}>{m.text}</div>
          </div>
        ))}
        <div ref={bottomRef}/>
      </div>
      <div className="chat-input-area">
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:8,textAlign:'center'}}>
          Ask anything — concepts, worked examples, exam tips, or MYP criterion guidance
        </div>
        <div className="chat-input-row">
          <textarea
            ref={taRef}
            className="chat-textarea"
            rows={1}
            placeholder="Ask your AI teacher anything..."
            value={input}
            onChange={e=>{setInput(e.target.value);e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';}}
            onKeyDown={handleKey}
          />
          <button className="send-btn" onClick={send}>
            <Icon name="send" size={14} color="#030712"/>
          </button>
        </div>
      </div>
    </div>
  );
};

/* ─── Settings ─── */
const Settings = ({user, onUpdate}) => {
  const [name, setName] = useState(user.name);
  const [year, setYear] = useState(user.year);
  const [track, setTrack] = useState(user.track);
  const [saved, setSaved] = useState(false);

  const save = () => {
    onUpdate({name,year,track});
    setSaved(true);
    setTimeout(()=>setSaved(false),2500);
  };

  return (
    <div className="fade-in">
      <div className="page-hero">
        <div className="hero-eyebrow">Account</div>
        <h1 className="hero-title">Settings</h1>
        <p className="hero-sub">Manage your profile and learning preferences.</p>
      </div>
      <div className="page-content" style={{maxWidth:600}}>
        <div className="settings-section">
          <div className="section-title" style={{fontSize:14,marginBottom:20}}>Profile</div>
          <div style={{marginBottom:20}}>
            <div className="settings-field-label">Display Name</div>
            <input
              className="onboard-input"
              type="text"
              value={name}
              onChange={e=>setName(e.target.value)}
              placeholder="Your name"
            />
          </div>
        </div>
        <div className="settings-section">
          <div className="section-title" style={{fontSize:14,marginBottom:20}}>Learning Preferences</div>
          <div style={{marginBottom:20}}>
            <div className="settings-field-label">MYP Year</div>
            <div className="year-grid">
              {[1,2,3,4,5].map(y=>(
                <div key={y} className={`year-tile${year===y?' active':''}`} onClick={()=>setYear(y)}>
                  <div className="year-tile-num">{y}</div>
                  <div className="year-tile-label">Year {y}</div>
                </div>
              ))}
            </div>
          </div>
          <div>
            <div className="settings-field-label">Mathematics Track</div>
            <div className="track-grid">
              <div className={`track-tile${track==='standard'?' active':''}`} onClick={()=>setTrack('standard')}>
                <div className="track-icon"><Icon name="book" size={22} color={track==='standard'?'#D4AF37':'rgba(255,255,255,0.5)'}/></div>
                <div className="track-name" style={{color:track==='standard'?'#D4AF37':'var(--text-primary)'}}>Standard</div>
                <div className="track-desc">Core MYP Mathematics</div>
              </div>
              <div className={`track-tile${track==='extended'?' active':''}`} onClick={()=>setTrack('extended')}>
                <div className="track-icon"><Icon name="zap" size={22} color={track==='extended'?'#D4AF37':'rgba(255,255,255,0.5)'}/></div>
                <div className="track-name" style={{color:track==='extended'?'#D4AF37':'var(--text-primary)'}}>Extended</div>
                <div className="track-desc">Extended Mathematics</div>
              </div>

          {saved ? <><Icon name="check" size={16} color="#030712"/> Saved!</> : <>Save Changes <Icon name="arrowRight" size={15} color="#030712"/></>}
        </button>
      </div>
    </div>
  );
};

/* ─── App Shell ─── */
const AppShell = ({user, onSignOut, onUpdateUser}) => {
  const [active, setActive] = useState('dashboard');
  const pageMap = {
    'dashboard': <Dashboard user={user}/>,
    'ai-teacher': <AITeacher user={user}/>,
    'question-bank': <QuestionBank user={user}/>,
    'practice-papers': <PracticePapers/>,
    'investigations': <Investigations/>,
    'criterion-tests': <CriterionTests/>,
    'my-progress': <MyProgress user={user}/>,
    'settings': <Settings user={user} onUpdate={onUpdateUser}/>,
  };
  return (
    <div className="app-shell">
      <Sidebar active={active} setActive={setActive} user={user} onSignOut={onSignOut}/>
      <main className="main-area">
        {pageMap[active] || pageMap['dashboard']}
      </main>
    </div>
  );
};

/* ─── Root App ─── */
const App = () => {
  const [phase, setPhase] = useState('landing'); // landing | onboarding | app
  const [user, setUser] = useState(null);

  const handleOnboardComplete = (data) => {
    setUser(data);
    setPhase('app');
  };
  const handleSignOut = () => {
    setUser(null);
    setPhase('landing');
  };
  const handleUpdateUser = (data) => {
    setUser(prev=>({...prev,...data}));
  };

  if(phase==='landing') return <LandingPage onStart={()=>setPhase('onboarding')}/>;
  if(phase==='onboarding') return <Onboarding onComplete={handleOnboardComplete}/>;
  return <AppShell user={user} onSignOut={handleSignOut} onUpdateUser={handleUpdateUser}/>;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
